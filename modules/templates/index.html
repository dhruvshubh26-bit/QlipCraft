<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QlipCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#08040f; --surface:#120a24; --card:#1a0f30;
    --primary:#8b5cf6; --primary-2:#c4b5fd;
    --text:#f5f3ff; --muted:#8b7cb8; --border:rgba(139,92,246,0.18);
    --glow:0 20px 60px -20px rgba(139,92,246,0.6);
  }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; min-height:100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139,92,246,0.18), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168,85,247,0.1), transparent);
    background-attachment:fixed;
    padding-bottom:120px;
  }
  .scroll-x { overflow-x:auto; scrollbar-width:none; }
  .scroll-x::-webkit-scrollbar { display:none; }

  /* NAV */
  .nav {
    position:sticky; top:0; z-index:100;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    background:rgba(8,4,15,0.7);
    border-bottom:1px solid var(--border);
    height:68px; padding:0 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark {
    width:38px; height:38px; border-radius:11px;
    background:linear-gradient(135deg,#8b5cf6,#c4b5fd);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 24px rgba(139,92,246,0.5);
    position:relative;
  }
  .brand-mark::after {
    content:''; position:absolute; inset:0; border-radius:11px;
    background:linear-gradient(135deg,transparent,rgba(255,255,255,0.3));
    opacity:0.5;
  }
  .brand-mark svg { width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.5; }
  .brand-name {
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:19px; letter-spacing:-0.02em;
    background:linear-gradient(135deg,#fff,#c4b5fd);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .nav-icons { display:flex; gap:6px; }
  .icon-btn {
    width:40px; height:40px; border-radius:11px; border:none;
    background:transparent; color:#a78bfa; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.2s ease;
  }
  .icon-btn:hover { background:rgba(139,92,246,0.15); color:#fff; }
  .icon-btn svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* HERO */
  .hero { padding:56px 24px 32px; max-width:1180px; margin:0 auto; }
  .badge {
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:100px;
    background:rgba(139,92,246,0.1); border:1px solid rgba(139,92,246,0.3);
    color:#c4b5fd; font-size:11px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; margin-bottom:20px;
  }
  .badge-dot { width:6px; height:6px; border-radius:50%; background:#a78bfa; box-shadow:0 0 8px #a78bfa; }
  h1 {
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(34px,5vw,54px); line-height:1.05;
    letter-spacing:-0.03em; margin-bottom:16px; max-width:800px;
  }
  h1 span {
    background:linear-gradient(135deg,#a78bfa,#c4b5fd);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hero p { color:var(--muted); font-size:17px; line-height:1.6; max-width:560px; }

  /* STORIES */
  .stories { display:flex; gap:18px; padding:32px 24px; max-width:1180px; margin:0 auto; }
  .story { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .story-ring {
    width:70px; height:70px; border-radius:50%;
    padding:2.5px; background:linear-gradient(135deg,#8b5cf6,#c4b5fd);
    transition:transform 0.25s ease;
  }
  .story:hover .story-ring { transform:scale(1.08); }
  .story-inner {
    width:100%; height:100%; border-radius:50%;
    background:var(--surface); border:2.5px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  .story-inner svg { width:26px; height:26px; stroke:#c4b5fd; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .story-label { font-size:11px; color:var(--muted); font-weight:500; }

  /* SECTION */
  .section { max-width:1180px; margin:0 auto; padding:0 24px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; margin:40px 0 20px; }
  .section-head h2 { font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600; letter-spacing:-0.01em; }
  .section-head a { color:#a78bfa; font-size:13px; font-weight:500; text-decoration:none; cursor:pointer; }

  /* PILLS */
  .pills { display:flex; gap:10px; padding-bottom:8px; }
  .pill {
    flex-shrink:0; display:flex; align-items:center; gap:8px;
    padding:10px 16px; border-radius:12px;
    background:var(--surface); border:1.5px solid transparent;
    color:#c4b5fd; font-family:inherit; font-size:13.5px; font-weight:500;
    cursor:pointer; transition:all 0.2s ease;
  }
  .pill svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .pill:hover { background:var(--card); transform:translateY(-1px); }
  .pill.active {
    background:linear-gradient(135deg,#8b5cf6,#a78bfa);
    color:#fff; border-color:rgba(196,181,253,0.5);
    box-shadow:0 8px 24px -8px rgba(139,92,246,0.6);
  }

  /* CREATE CARD */
  .create {
    max-width:720px; margin:32px auto; padding:40px;
    background:linear-gradient(160deg,#1a0f30,#120a24);
    border:1px solid var(--border); border-radius:28px;
    position:relative; overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(139,92,246,0.4);
  }
  .create::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(196,181,253,0.5),transparent);
  }
  .create h3 { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; margin-bottom:6px; letter-spacing:-0.01em; }
  .create .sub { color:var(--muted); font-size:14.5px; margin-bottom:32px; }
  .field { margin-bottom:24px; }
  .field label {
    display:block; font-size:11px; font-weight:600;
    color:#a78bfa; text-transform:uppercase; letter-spacing:0.12em;
    margin-bottom:10px;
  }
  .cat-chip {
    display:inline-flex; align-items:center; gap:9px;
    padding:10px 16px; border-radius:12px;
    background:rgba(139,92,246,0.12); border:1px solid rgba(139,92,246,0.4);
    color:#e9d5ff; font-size:14px; font-weight:500;
  }
  .cat-chip svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .input {
    width:100%; padding:18px 20px; border-radius:14px;
    background:#08040f; border:1.5px solid rgba(139,92,246,0.25);
    color:#fff; font-family:inherit; font-size:16px; outline:none;
    transition:all 0.2s ease;
  }
  .input::placeholder { color:#5b4d7a; }
  .input:focus { border-color:#8b5cf6; box-shadow:0 0 0 4px rgba(139,92,246,0.15); }
  .btn {
    width:100%; padding:18px; border-radius:14px; border:none;
    background:linear-gradient(135deg,#8b5cf6,#a78bfa);
    color:#fff; font-family:inherit; font-size:15.5px; font-weight:600;
    cursor:pointer; transition:all 0.25s ease;
    box-shadow:0 12px 32px -8px rgba(139,92,246,0.7);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 16px 40px -8px rgba(139,92,246,0.9); }
  .btn:disabled { opacity:0.55; cursor:not-allowed; }
  .btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .loader {
    display:none; margin-top:20px; padding:18px;
    background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.25);
    border-radius:14px; color:#c4b5fd; font-size:14px;
    display:none; align-items:center; justify-content:center; gap:12px;
  }
  .loader.show { display:flex; }
  .spinner {
    width:18px; height:18px; border:2.5px solid rgba(196,181,253,0.2);
    border-top-color:#c4b5fd; border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* FEED */
  .feed { max-width:720px; margin:0 auto; padding:0 24px; }
  .feed-card {
    background:linear-gradient(160deg,#1a0f30,#120a24);
    border:1px solid var(--border); border-radius:24px;
    overflow:hidden; margin-bottom:24px;
    transition:transform 0.25s ease;
  }
  .feed-head { display:flex; align-items:center; gap:14px; padding:18px 22px; }
  .avatar {
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#8b5cf6,#c4b5fd);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#fff;
  }
  .feed-name { font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px; }
  .verified {
    width:16px; height:16px; border-radius:50%;
    background:linear-gradient(135deg,#8b5cf6,#c4b5fd);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .verified svg { width:10px; height:10px; stroke:#fff; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .feed-time { font-size:12.5px; color:var(--muted); margin-top:3px; }
  .feed-video { width:100%; display:block; background:#000; max-height:560px; object-fit:contain; }
  .feed-body { padding:18px 22px 22px; }
  .feed-caption { font-size:14.5px; line-height:1.6; color:#e0d5f5; margin-bottom:10px; }
  .feed-tags { font-size:13px; color:#a78bfa; }

  .empty {
    text-align:center; padding:80px 24px;
    color:var(--muted); font-size:14.5px;
  }
  .empty svg { width:56px; height:56px; stroke:#4a3d6e; fill:none; stroke-width:1.5; margin-bottom:16px; }

  /* BOTTOM NAV */
  .tabbar {
    position:fixed; bottom:0; left:0; right:0;
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    background:rgba(18,10,36,0.85);
    border-top:1px solid var(--border);
    height:76px; display:flex; align-items:center; justify-content:space-around;
    padding:0 16px; z-index:200;
  }
  .tab {
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; cursor:pointer;
    color:#5b4d7a; font-family:inherit; font-size:10.5px; font-weight:500;
    padding:8px 12px; border-radius:10px; transition:color 0.2s ease;
  }
  .tab:hover { color:#a78bfa; }
  .tab.active { color:#c4b5fd; }
  .tab svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tab-plus {
    width:58px; height:58px; border-radius:50%; border:none;
    background:linear-gradient(135deg,#8b5cf6,#a78bfa);
    box-shadow:0 10px 30px -8px rgba(139,92,246,0.9);
    display:flex; align-items:center; justify-content:center;
    margin-top:-24px; cursor:pointer; transition:transform 0.2s ease;
  }
  .tab-plus:hover { transform:scale(1.06); }
  .tab-plus svg { width:26px; height:26px; stroke:#fff; fill:none; stroke-width:2.5; stroke-linecap:round; }

  /* MODAL */
  .modal {
    position:fixed; inset:0; z-index:500;
    background:rgba(4,2,10,0.85); backdrop-filter:blur(12px);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal.show { display:flex; animation:fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .modal-card {
    background:linear-gradient(160deg,#1a0f30,#120a24);
    border:1px solid var(--border); border-radius:24px;
    max-width:480px; width:100%; max-height:90vh; overflow-y:auto;
    padding:28px;
  }
  .modal-card h3 { font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:600; margin-bottom:18px; }
  .modal-video { width:100%; border-radius:16px; margin-bottom:18px; background:#000; }
  .modal-meta {
    background:#08040f; padding:18px; border-radius:14px;
    font-size:13.5px; line-height:1.8; margin-bottom:18px;
  }
  .modal-meta b { color:#a78bfa; font-weight:600; }
  .btn-close {
    width:100%; padding:14px; border-radius:12px;
    background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3);
    color:#e9d5ff; font-family:inherit; font-size:14px; font-weight:600;
    cursor:pointer; transition:background 0.2s ease;
  }
  .btn-close:hover { background:rgba(139,92,246,0.25); }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M16 16l4 4"/></svg>
    </div>
    <div class="brand-name">QlipCraft</div>
  </div>
  <div class="nav-icons">
    <button class="icon-btn" onclick="alert('Notifications')"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
    <button class="icon-btn" onclick="alert('Messages')"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <button class="icon-btn" onclick="alert('Menu')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="badge"><span class="badge-dot"></span>AI-Powered</div>
  <h1>Videos that fit <span>each community.</span></h1>
  <p>Type a topic. Pick a community. Get a Qlip ready for the Qoneqt Global Feed.</p>
</section>

<!-- STORIES -->
<div class="stories scroll-x" id="stories"></div>

<!-- TRENDING -->
<div class="section">
  <div class="section-head">
    <h2>Trending Categories</h2>
    <a>All Networks →</a>
  </div>
  <div class="pills scroll-x" id="pills"></div>
</div>

<!-- CREATE -->
<div class="create">
  <h3>Create a Qlip</h3>
  <p class="sub">AI generates a community-fit video for Qoneqt</p>

  <div class="field">
    <label>Selected Community</label>
    <div class="cat-chip" id="catChip">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
      <span id="catName">Technology</span>
    </div>
  </div>

  <div class="field">
    <label>Topic</label>
    <input class="input" id="topic" placeholder="e.g. 5-minute pasta recipe">
  </div>

  <button class="btn" id="genBtn" onclick="generate()">
    <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
    Generate Qlip
  </button>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span id="loaderText">Generating script…</span>
  </div>
</div>

<!-- FEED -->
<div class="section-head" style="max-width:720px;margin:48px auto 20px;padding:0 24px;">
  <h2>Recent Qlips</h2>
</div>
<div class="feed" id="feed"></div>

<!-- BOTTOM NAV -->
<nav class="tabbar">
  <button class="tab active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button class="tab" onclick="document.getElementById('feed').scrollIntoView({behavior:'smooth'})">
    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M2 12h5M22 12h-5"/></svg>
    Qlips
  </button>
  <button class="tab-plus" onclick="window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>document.getElementById('topic').focus(),400)">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="tab" onclick="document.getElementById('topic').focus()">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Search
  </button>
  <button class="tab" onclick="document.getElementById('pills').scrollIntoView({behavior:'smooth'})">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Networks
  </button>
</nav>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <h3>✨ Your Qlip is ready</h3>
    <video class="modal-video" id="modalVideo" controls autoplay playsinline></video>
    <div class="modal-meta" id="modalMeta"></div>
    <button class="btn-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const ICONS = {
  'Jobs':'<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
  'Internship':'<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  'Gaming':'<svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>',
  'Event':'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  'Education':'<svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>',
  'Technology':'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>',
  'Sports':'<svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>',
  'Entertainment':'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>',

const COMMUNITIES = ['Jobs','Internship','Gaming','Event','Education','Technology','Sports','Entertainment','Blockchain','Company','News','General','Art','Personalities','Food & Cooking','Health & Fitness','Business & Finance','Travel & Lifestyle','Fashion & Photography','Motivation & Wellness','Learning & Growth','Quotes & Nature'];

let selected = 'Technology';
const RECENT = JSON.parse(document.getElementById('feed').dataset.recent || '[]');

function render() {
  // Stories
  document.getElementById('stories').innerHTML = COMMUNITIES.slice(0,12).map(c => `
    <div class="story" onclick="pickCategory('${c}')">
      <div class="story-ring"><div class="story-inner">${ICONS[c]}</div></div>
      <div class="story-label">${c.split(' ')[0]}</div>
    </div>`).join('');

  // Pills
  document.getElementById('pills').innerHTML = COMMUNITIES.map(c => `
    <button class="pill ${c===selected?'active':''}" data-cat="${c}" onclick="pickCategory('${c}')">
      ${ICONS[c]}<span>${c}</span>
    </button>`).join('');

  // Feed
  const feed = document.getElementById('feed');
  if (!RECENT.length) {
    feed.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M2 12h5M22 12h-5"/></svg>
      <div>No Qlips yet. Generate your first one above.</div>
    </div>`;
  } else {
    feed.innerHTML = RECENT.map(q => `
      <div class="feed-card">
        <div class="feed-head">
          <div class="avatar">Q</div>
          <div>
            <div class="feed-name">QlipCraft <span class="verified"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span></div>
            <div class="feed-time">just now · ${q.community}</div>
          </div>
        </div>
        <video class="feed-video" src="/output/${q.id}.mp4" controls preload="metadata"></video>
        <div class="feed-body">
          <div class="feed-caption">${q.caption}</div>
          <div class="feed-tags">${q.hashtags}</div>
        </div>
      </div>`).join('');
  }
}

function pickCategory(c) {
  selected = c;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.cat===c));
  document.getElementById('catName').textContent = c;
  document.querySelector('#catChip svg').outerHTML = ICONS[c];
}

async function generate() {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { alert('Please enter a topic'); return; }
  const btn = document.getElementById('genBtn');
  const loader = document.getElementById('loader');
  const lt = document.getElementById('loaderText');
  btn.disabled = true;
  loader.classList.add('show');
  const steps = ['Generating script…','Writing voiceover…','Picking visuals…','Composing video…'];
  let i=0; const t = setInterval(()=>{ lt.textContent = steps[i++%4]; }, 2500);

  try {
    const fd = new FormData();
    fd.append('topic', topic);
    fd.append('community', selected);
    const r = await fetch('/generate', {method:'POST', body:fd});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    document.getElementById('modalVideo').src = '/output/'+d.id+'.mp4';
    document.getElementById('modalMeta').innerHTML =
      `<b>Hook 1:</b> ${d.hook1}<br><b>Hook 2:</b> ${d.hook2}<br><b>Caption:</b> ${d.caption}<br><b>Hashtags:</b> ${d.hashtags}`;
    document.getElementById('modal').classList.add('show');
    setTimeout(()=>location.reload(), 2000);
  } catch(e) { alert('Error: '+e.message); }
  finally { clearInterval(t); btn.disabled=false; loader.classList.remove('show'); }
}

function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

render();
</script>
